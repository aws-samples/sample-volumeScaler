# Default values for VolumeScaler chart

image:
  repository: public.ecr.aws/ghanem/volumescaler
  tag: "{{ .Chart.AppVersion }}"
  pullPolicy: Always

rbac:
  create: true
  serviceAccountName: pvc-resizer

# The controller now runs as a single leader-elected Deployment instead of a
# DaemonSet. Kubelet usage data is fetched via the API server proxy, so the
# controller does not need to run on every node.
deployment:
  name: volumescaler-controller
  namespace: kube-system
  replicas: 2
  labels: {}
  nodeSelector:
    kubernetes.io/os: linux
  tolerations: []
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                app: volumescaler
            topologyKey: kubernetes.io/hostname
  priorityClassName: system-cluster-critical

leaderElection:
  enabled: true
  leaseName: volumescaler-controller

podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Resources for container
resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

pvcResizerEnv: []  # Additional environment variables if needed
